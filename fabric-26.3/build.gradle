plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.+'
}

base {
    archivesName = 'dragarmor'
}

version = "${rootProject.mod_version}+26.3"
group = rootProject.maven_group

sourceSets {
    main {
        java {
            srcDir rootProject.file('common/src/main/java')
        }
    }
}

repositories {
    mavenLocal()
}

dependencies {
    compileOnly "dev.lumyrix:lumlib-fabric-26.3:1.0.0"
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.162.0+26.3"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
